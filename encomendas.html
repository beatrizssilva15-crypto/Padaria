<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padaria Santo Antônio - Faça sua Encomenda</title>
</head>
<body>

    <header>
        <h1>Padaria Santo Antônio</h1>
        <nav>
            <a href="index.html">Início</a> | 
            <a href="cardapio.html">Cardápio</a> | 
            <a href="encomendas.html">Encomendas</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Faça sua Encomenda Online</h2>
            <p>Preencha o formulário abaixo para encomendar seus produtos para festas ou eventos.</p>

            <form action="#" method="post">
                <!-- Campo de Texto -->
                <p>
                    <label for="nome">Nome Completo:</label><br>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
                </p>

                <!-- Campo de E-mail -->
                <p>
                    <label for="email">E-mail de Contato:</label><br>
                    <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
                </p>

                <!-- Campo de Telefone com Regex (DDD + 9 dígitos) -->
                <p>
                    <label for="telefone">Telefone / WhatsApp (ex: 11999998888):</label><br>
                    <input type="tel" id="telefone" name="telefone" pattern="[0-9]{2}[0-9]{5}[0-9]{4}" placeholder="11999998888" required title="Digite 11 dígitos numéricos com DDD (ex: 11999998888)">
                </p>

                <!-- Campo de Seleção (3+ opções) -->
                <p>
                    <label for="tipo_encomenda">Tipo de Encomenda:</label><br>
                    <select id="tipo_encomenda" name="tipo_encomenda" required>
                        <option value="">-- Selecione uma opção --</option>
                        <option value="cento_salgados">Cento de Salgados Variados</option>
                        <option value="bolo_aniversario">Bolo de Aniversário Personalizado</option>
                        <option value="kit_festa">Kit Festa (Bolo + Salgados + Doces)</option>
                        <option value="paes_especiais">Lote de Pães Especiais</option>
                    </select>
                </p>

                <!-- Campo de Data -->
                <p>
                    <label for="data_retirada">Data da Retirada:</label><br>
                    <input type="date" id="data_retirada" name="data_retirada" required>
                </p>

                <!-- Campo de Hora -->
                <p>
                    <label for="hora_retirada">Horário da Retirada:</label><br>
                    <input type="time" id="hora_retirada" name="hora_retirada" required>
                </p>

                <!-- Botão de Envio -->
                <p>
                    <button type="submit">Enviar Encomenda</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Padaria Santo Antônio - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
